<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonte Santa — Time on Market</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #FFFFFF;
    font-family: 'Montserrat', sans-serif;
    padding: 0;
  }

  .chart-card {
    background: #fff;
    border-left: 3px solid #C9A96E;
    padding: 32px 32px 24px;
    max-width: 820px;
    margin: 0 auto;
  }

  .chart-header {
    margin-bottom: 24px;
  }

  .chart-eyebrow {
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #C9A96E;
    margin-bottom: 8px;
  }

  .chart-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 400;
    color: #2A2A2A;
    line-height: 1.2;
    margin-bottom: 6px;
  }

  .chart-subtitle {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 300;
    color: #2A2A2A;
    opacity: 0.55;
    letter-spacing: 0.04em;
  }

  .chart-wrap {
    position: relative;
    width: 100%;
    height: 320px;
  }

  .chart-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 18px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .legend {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: #2A2A2A;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .legend-line {
    width: 18px;
    height: 2px;
    background: repeating-linear-gradient(
      to right,
      rgba(201,169,110,0.5) 0px,
      rgba(201,169,110,0.5) 4px,
      transparent 4px,
      transparent 8px
    );
    flex-shrink: 0;
  }

  .chart-source {
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    font-weight: 300;
    color: #2A2A2A;
    opacity: 0.38;
    letter-spacing: 0.06em;
  }

  .gold-rule {
    height: 1px;
    background: #C9A96E;
    opacity: 0.25;
    margin: 20px 0;
  }
</style>
</head>
<body>

<div class="chart-card">
  <div class="chart-header">
    <div class="chart-eyebrow">Fonte Santa Area — 2026 Market Data</div>
    <div class="chart-title">How long properties sit on the market</div>
    <div class="chart-subtitle">Average months before sale or delisting · apartments and villas by price segment</div>
  </div>

  <div class="gold-rule"></div>

  <div class="chart-wrap">
    <canvas id="marketChart"></canvas>
  </div>

  <div class="chart-footer">
    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="background: rgba(201,169,110,0.85);"></div>
        Apartments
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background: rgba(42,42,42,0.85);"></div>
        Villas &amp; Townhouses
      </div>
      <div class="legend-item">
        <div class="legend-line"></div>
        12 months
      </div>
    </div>
    <div class="chart-source">Source: 2026 listings data &nbsp;·&nbsp; Sold and delisted properties</div>
  </div>
</div>

<script>
  const labels = [
    '€150K–200K','€200K–250K','€250K–300K','€300K–400K',
    '€400K–500K','€500K–600K','€600K–700K','€700K–800K',
    '€800K–900K','€900K–1M','€1M–1.5M',
    '€1.5M–2M','€2M–2.5M','€2.5M–5M'
  ];

  const aptData   = [6, 7, 6.5, 9.5, 9, 15, 12, 21, 11, 12, 15, null, null, null];
  const villaData = [null, null, null, null, 13, 15, 13, 13, 16, 15, 14, 21, 12, 24];
  const refLine   = Array(14).fill(12);

  const gold    = 'rgba(201,169,110,0.85)';
  const goldBdr = 'rgba(201,169,110,1)';
  const dark    = 'rgba(42,42,42,0.85)';
  const darkBdr = 'rgba(42,42,42,1)';

  const ctx = document.getElementById('marketChart').getContext('2d');

  new Chart(ctx, {
    data: {
      labels,
      datasets: [
        {
          type: 'bar',
          label: 'Apartments',
          data: aptData,
          backgroundColor: gold,
          borderColor: goldBdr,
          borderWidth: 0,
          borderRadius: 2,
          barPercentage: 0.8,
          categoryPercentage: 0.75,
          order: 2,
          skipNull: true,
        },
        {
          type: 'bar',
          label: 'Villas & Townhouses',
          data: villaData,
          backgroundColor: dark,
          borderColor: darkBdr,
          borderWidth: 0,
          borderRadius: 2,
          barPercentage: 0.8,
          categoryPercentage: 0.75,
          order: 2,
          skipNull: true,
        },
        {
          type: 'line',
          label: '12 months',
          data: refLine,
          borderColor: 'rgba(201,169,110,0.45)',
          borderDash: [5, 5],
          borderWidth: 1.5,
          pointRadius: 0,
          fill: false,
          tension: 0,
          order: 1,
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'index',
        intersect: false,
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#2A2A2A',
          titleFont: { family: 'Montserrat', size: 10, weight: '600' },
          bodyFont: { family: 'Montserrat', size: 11, weight: '300' },
          padding: 12,
          cornerRadius: 2,
          callbacks: {
            label: (ctx) => {
              if (ctx.dataset.label === '12 months') return null;
              if (ctx.raw === null) return null;
              return ` ${ctx.dataset.label}: ${ctx.raw} months`;
            }
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          border: { color: 'rgba(42,42,42,0.12)' },
          ticks: {
            font: { family: 'Montserrat', size: 9, weight: '400' },
            color: 'rgba(42,42,42,0.55)',
            maxRotation: 45,
            minRotation: 45,
          }
        },
        y: {
          beginAtZero: true,
          max: 27,
          grid: {
            color: 'rgba(42,42,42,0.06)',
            drawBorder: false,
          },
          border: { display: false, dash: [3,3] },
          ticks: {
            font: { family: 'Montserrat', size: 9, weight: '400' },
            color: 'rgba(42,42,42,0.45)',
            stepSize: 3,
            callback: (v) => v === 0 ? '' : `${v}mo`
          }
        }
      }
    }
  });
</script>
</body>
</html>
