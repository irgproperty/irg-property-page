<!-- IRG Property — Fonte Santa Time on Market Chart -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>

<style>
.irg-chart-card {
  background: #fff;
  border-left: 3px solid #C9A96E;
  padding: 32px 32px 24px;
  max-width: 820px;
  margin: 40px auto;
  font-family: 'Montserrat', sans-serif;
}
.irg-chart-eyebrow {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #C9A96E;
  margin-bottom: 8px;
}
.irg-chart-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 400;
  color: #2A2A2A;
  line-height: 1.2;
  margin-bottom: 6px;
}
.irg-chart-subtitle {
  font-size: 11px;
  font-weight: 300;
  color: #2A2A2A;
  opacity: 0.55;
  letter-spacing: 0.04em;
  margin-bottom: 0;
}
.irg-gold-rule {
  height: 1px;
  background: #C9A96E;
  opacity: 0.25;
  margin: 20px 0;
  border: none;
}
.irg-chart-wrap {
  position: relative;
  width: 100%;
  height: 320px;
}
.irg-chart-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 18px;
  flex-wrap: wrap;
  gap: 12px;
}
.irg-legend {
  display: flex;
  gap: 20px;
  align-items: center;
  flex-wrap: wrap;
}
.irg-legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: #2A2A2A;
}
.irg-legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  flex-shrink: 0;
}
.irg-legend-dash {
  width: 18px;
  height: 0;
  border-top: 2px dashed rgba(201,169,110,0.55);
  flex-shrink: 0;
}
.irg-chart-source {
  font-size: 9px;
  font-weight: 300;
  color: #2A2A2A;
  opacity: 0.38;
  letter-spacing: 0.06em;
}
</style>

<div class="irg-chart-card">
  <div class="irg-chart-eyebrow">Fonte Santa Area — 2026 Market Data</div>
  <div class="irg-chart-title">How long properties sit on the market</div>
  <div class="irg-chart-subtitle">Average months before sale or delisting &nbsp;·&nbsp; apartments and villas by price segment</div>
  <hr class="irg-gold-rule">
  <div class="irg-chart-wrap">
    <canvas id="irgFonteSantaChart"></canvas>
  </div>
  <div class="irg-chart-footer">
    <div class="irg-legend">
      <div class="irg-legend-item">
        <div class="irg-legend-dot" style="background:rgba(201,169,110,0.85);"></div>
        Apartments
      </div>
      <div class="irg-legend-item">
        <div class="irg-legend-dot" style="background:rgba(42,42,42,0.85);"></div>
        Villas &amp; Townhouses
      </div>
      <div class="irg-legend-item">
        <div class="irg-legend-dash"></div>
        12 months
      </div>
    </div>
    <div class="irg-chart-source">Source: 2026 listings data &nbsp;·&nbsp; Sold and delisted properties</div>
  </div>
</div>

<script>
(function() {
  var labels = [
    '€150K–200K','€200K–250K','€250K–300K','€300K–400K',
    '€400K–500K','€500K–600K','€600K–700K','€700K–800K',
    '€800K–900K','€900K–1M','€1M–1.5M',
    '€1.5M–2M','€2M–2.5M','€2.5M–5M'
  ];
  var aptData   = [6, 7, 6.5, 9.5, 9, 15, 12, 21, 11, 12, 15, null, null, null];
  var villaData = [null, null, null, null, 13, 15, 13, 13, 16, 15, 14, 21, 12, 24];
  var refLine   = Array(14).fill(12);

  var ctx = document.getElementById('irgFonteSantaChart').getContext('2d');
  new Chart(ctx, {
    data: {
      labels: labels,
      datasets: [
        {
          type: 'bar',
          label: 'Apartments',
          data: aptData,
          backgroundColor: 'rgba(201,169,110,0.85)',
          borderWidth: 0,
          borderRadius: 2,
          barPercentage: 0.8,
          categoryPercentage: 0.75,
          order: 2
        },
        {
          type: 'bar',
          label: 'Villas & Townhouses',
          data: villaData,
          backgroundColor: 'rgba(42,42,42,0.85)',
          borderWidth: 0,
          borderRadius: 2,
          barPercentage: 0.8,
          categoryPercentage: 0.75,
          order: 2
        },
        {
          type: 'line',
          label: '12 months',
          data: refLine,
          borderColor: 'rgba(201,169,110,0.45)',
          borderDash: [5,5],
          borderWidth: 1.5,
          pointRadius: 0,
          fill: false,
          tension: 0,
          order: 1
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#2A2A2A',
          titleFont: { family: 'Montserrat', size: 10, weight: '600' },
          bodyFont: { family: 'Montserrat', size: 11, weight: '300' },
          padding: 12,
          cornerRadius: 2,
          callbacks: {
            label: function(ctx) {
              if (ctx.dataset.label === '12 months') return null;
              if (ctx.raw === null) return null;
              return ' ' + ctx.dataset.label + ': ' + ctx.raw + ' months';
            }
          }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          border: { color: 'rgba(42,42,42,0.12)' },
          ticks: {
            font: { family: 'Montserrat', size: 9 },
            color: 'rgba(42,42,42,0.55)',
            maxRotation: 45,
            minRotation: 45
          }
        },
        y: {
          beginAtZero: true,
          max: 27,
          grid: { color: 'rgba(42,42,42,0.06)' },
          border: { display: false },
          ticks: {
            font: { family: 'Montserrat', size: 9 },
            color: 'rgba(42,42,42,0.45)',
            stepSize: 3,
            callback: function(v) { return v === 0 ? '' : v + 'mo'; }
          }
        }
      }
    }
  });
})();
</script>
<!-- End IRG Property Chart -->
